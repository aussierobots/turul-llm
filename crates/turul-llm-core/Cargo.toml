[package]
name = "turul-llm-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Provider-neutral LLM client trait and types — one async method, JSON-Schema-driven structured output, zero provider deps."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }

[features]
# Shared send path for HTTP adapters; off by default so the trait crate
# stays free of an HTTP client. Its API follows reqwest's major version.
http = ["dep:reqwest"]

[package.metadata.docs.rs]
features = ["http"]

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
