[workspace]
resolver = "3"
members = [
  "crates/turul-llm-core",
  "crates/turul-llm-ollama",
  "crates/turul-llm-openai",
  "examples/greet-ollama",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Nick Hortovanyi <nick@aussierobots.com.au>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aussierobots/turul-llm"
keywords = ["llm", "ai", "async", "tokio", "ollama"]
categories = ["api-bindings", "asynchronous"]
rust-version = "1.94"

[workspace.dependencies]
# Core deps — keep turul-llm-core's transitive surface tiny.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"

# Async runtime / IO — only adapter crates and examples pull these in.
tokio = { version = "1", features = ["full"] }

# HTTP — used by adapter crates only. rustls keeps us off the system OpenSSL path.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Logging — examples only.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

# Test deps
wiremock = "0.6"

# Workspace-internal crates. `path` is used during local development;
# `version` is what the published manifest carries. Keep both fields in
# lockstep with [workspace.package].version above.
turul-llm-core = { path = "crates/turul-llm-core", version = "0.1.2" }
turul-llm-ollama = { path = "crates/turul-llm-ollama", version = "0.1.2" }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0
